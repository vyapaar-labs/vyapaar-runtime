[package]
name = "vyapaar-runtime-api-rest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "REST API server for the Vyapaar platform (axum)"

[lib]
name = "vyapaar_runtime_api_rest"

[dependencies]
vyapaar-core.workspace = true
vyapaar-risk.workspace = true
vyapaar-runtime-api.workspace = true
vyapaar-runtime-feed.workspace = true
vyapaar-runtime-market.workspace = true
vyapaar-market-finance.workspace = true
vyapaar-runtime-strategy.workspace = true
vyapaar-agent-analytics.workspace = true
vyapaar-runtime-config.workspace = true
vyapaar-runtime-backtest.workspace = true
vyapaar-ledger-journal.workspace = true
vyapaar-ledger-portfolio.workspace = true
vyapaar-ledger-performance.workspace = true
vyapaar-runtime-testing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
anyhow.workspace = true
schemars.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures.workspace = true
tokio-stream.workspace = true
http-body-util.workspace = true
serde_urlencoded = "0.7"
# JWT authentication (HMAC-SHA256 and RSA verification)
jsonwebtoken = { version = "9.3", default-features = false, features = ["use_pem"] }
rsa = { version = "0.10.0-rc.19", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
# Run ids: OS entropy at the edge (ADR 0017 decision 2); chrono formats manifest timestamps.
getrandom = "0.3"
chrono.workspace = true
toml = "0.8"
hex = "0.4"
sha2 = "0.10"
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
uuid.workspace = true

[dev-dependencies]
arrow.workspace = true
parquet.workspace = true
tempfile = "3"
vyapaar-runtime-test-utils = { path = "../vyapaar-runtime-test-utils" }
tokio-tungstenite = "0.24"
